---
layout: default
---

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Primerjava vremena na destinaciji</title>

  <style>

  </style>
</head>

<body>

  <main class="weather-form">
    <h1>Preveri preteklo vreme</h1>

    <form id="destination-form">

      <div class="form-group">
        <label for="destination">Destinacija</label>

        <input
          type="text"
          id="destination"
          name="destination"
          placeholder="Na primer: Himarë, Albanija"
          required
        >
      </div>

      <div class="form-group">
        <label for="selected-date">Izberi datum</label>

        <input
          type="date"
          id="selected-date"
          name="selectedDate"
          required
        >
      </div>

      <button type="submit">Preveri vreme</button>
    </form>

    <section id="selection-summary" hidden>
      <h2>Izbrani podatki</h2>

      <p>
        <strong>Destinacija:</strong>
        <span id="selected-destination"></span>
      </p>

      <p>
        <strong>Datum:</strong>
        <span id="displayed-date"></span>
      </p>
    </section>
  </main>

  

</body>
</html>
